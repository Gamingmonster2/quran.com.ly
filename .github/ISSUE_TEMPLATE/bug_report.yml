name: بلاغ خطأ
description: أبلغ عن خطأ في الموقع أو البيانات أو الصوت
title: "[خطأ]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: وصف الخطأ, description: ماذا حدث؟ وماذا توقعت؟ }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: رابط الصفحة }
  - type: textarea
    id: steps
    attributes: { label: خطوات إعادة الإنتاج }
  - type: input
    id: device
    attributes: { label: الجهاز/المتصفح }
